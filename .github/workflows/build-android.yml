name: Build Android App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-35 build-tools;35.0.0'
        accept-android-sdk-licenses: true
        
    - name: Set Android SDK environment
      run: |
        echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
      
    - name: Install dependencies
      run: npm ci
      
    - name: Build web app
      run: npm run build
      env:
        VITE_REVENUECAT_GOOGLE_API_KEY: ${{ secrets.VITE_REVENUECAT_GOOGLE_API_KEY }}
        VITE_REVENUECAT_APPLE_API_KEY: ${{ secrets.VITE_REVENUECAT_APPLE_API_KEY }}
      
    - name: Clean and regenerate Android project  
      run: |
        rm -rf android
        npx cap add android
        npx cap sync android
        
        # Force clean all possible cached configurations
        rm -rf .gradle
        rm -rf ~/.gradle
        rm -rf android/.gradle
        rm -rf android/app/build
        rm -rf android/build

    - name: Restore custom native files
      run: |
        echo "Copying custom native overrides back into generated Android project..."
        
        cp native-overrides/android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
        cp native-overrides/android/app/google-services.json android/app/google-services.json
        
        mkdir -p android/app/src/main/java/com/momapp/family
        cp native-overrides/android/app/src/main/java/com/momapp/family/*.java android/app/src/main/java/com/momapp/family/
        # Copy Kotlin files if any exist
        find native-overrides/android/app/src/main/java/com/momapp/family/ -name "*.kt" -exec cp {} android/app/src/main/java/com/momapp/family/ \;
        
        echo "Restored files:"
        ls -la android/app/src/main/java/com/momapp/family/
        echo ""
        echo "AndroidManifest.xml POST_NOTIFICATIONS check:"
        grep -c "POST_NOTIFICATIONS" android/app/src/main/AndroidManifest.xml && echo "FOUND" || echo "MISSING"
        echo "AndroidManifest.xml AD_ID check:"
        grep -c "AD_ID" android/app/src/main/AndroidManifest.xml && echo "AD_ID FOUND" || echo "AD_ID MISSING"
        echo "Full permissions in manifest:"
        grep "uses-permission" android/app/src/main/AndroidManifest.xml
        echo ""
        echo "google-services.json check:"
        ls -la android/app/google-services.json
        
        echo "Adding Firebase dependency to app/build.gradle..."
        sed -i "/implementation project(':capacitor-android')/a\\    implementation 'com.google.firebase:firebase-messaging:23.3.1'" android/app/build.gradle
        
        echo "Adding Meta SDK dependency to app/build.gradle..."
        sed -i "/implementation 'com.google.firebase:firebase-messaging:23.3.1'/a\\    implementation 'com.facebook.android:facebook-android-sdk:17.0.1'" android/app/build.gradle
        
        echo "Adding RevenueCat dependency to app/build.gradle..."
        sed -i "/implementation 'com.facebook.android:facebook-android-sdk:17.0.1'/a\\    implementation 'com.revenuecat.purchases:purchases:7.+'" android/app/build.gradle
        
        echo "Ensuring Kotlin plugin is configured for RevenueCat.kt..."
        if ! grep -q "kotlin-android" android/app/build.gradle; then
          sed -i "s/apply plugin: 'com.android.application'/apply plugin: 'com.android.application'\napply plugin: 'kotlin-android'/" android/app/build.gradle
          echo "Added kotlin-android plugin to app/build.gradle"
        else
          echo "kotlin-android plugin already present"
        fi
        if ! grep -q "kotlin-gradle-plugin" android/build.gradle; then
          sed -i "/classpath 'com.android.tools.build:gradle/a\\        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'" android/build.gradle
          echo "Added Kotlin gradle plugin to project build.gradle"
        else
          echo "Kotlin gradle plugin already present"
        fi
        
        echo "Adding Google Services classpath to project build.gradle..."
        sed -i "/classpath 'com.android.tools.build:gradle/a\\        classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
        
        echo "Adding Google Services plugin to app/build.gradle..."
        echo "" >> android/app/build.gradle
        echo "try {" >> android/app/build.gradle
        echo "    def servicesJSON = file('google-services.json')" >> android/app/build.gradle
        echo "    if (servicesJSON.text) {" >> android/app/build.gradle
        echo "        apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
        echo "    }" >> android/app/build.gradle
        echo "} catch(Exception e) {" >> android/app/build.gradle
        echo "    logger.info('google-services.json not found, push notifications disabled')" >> android/app/build.gradle
        echo "}" >> android/app/build.gradle
        
        echo "Native overrides restored successfully"
        
    - name: Set correct app icon
      run: |
        # Copy The Mom App icon to all density folders
        for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
          cp resources/android/themomappicon.png android/app/src/main/res/mipmap-${density}/themomappicon.png
        done
        
        # Remove adaptive icon folder so Android uses the direct PNG
        rm -rf android/app/src/main/res/mipmap-anydpi-v26
        
        echo "App icon configured successfully"
        
    - name: Set version code and name
      run: |
        cd android
        
        # Replace existing versionCode and versionName in variables.gradle
        sed -i 's/versionCode = .*/versionCode = 117/' variables.gradle
        sed -i 's/versionName = .*/versionName = "10.17"/' variables.gradle
        
        # Also ensure compileSdkVersion and targetSdkVersion are 35
        sed -i 's/compileSdkVersion = .*/compileSdkVersion = 35/' variables.gradle
        sed -i 's/targetSdkVersion = .*/targetSdkVersion = 35/' variables.gradle
        
        echo "Updated variables.gradle:"
        cat variables.gradle
        
        # Update app/build.gradle to use the version variables
        cd app
        sed -i 's/versionCode.*$/versionCode 117/' build.gradle
        sed -i 's/versionName.*$/versionName "10.17"/' build.gradle
        
        echo "Final build.gradle version configuration:"
        grep -A2 -B2 "versionCode\|versionName" build.gradle
      
    - name: Force all plugins to API level 35
      run: |
        # Force all Capacitor plugin build.gradle files to use API 35 instead of 34
        find node_modules -name "build.gradle" -exec sed -i 's/compileSdkVersion : 34/compileSdkVersion : 35/g' {} +
        find node_modules -name "build.gradle" -exec sed -i 's/targetSdkVersion : 34/targetSdkVersion : 35/g' {} +
        find node_modules -name "build.gradle" -exec sed -i "s/compileSdk 34/compileSdk 35/g" {} +
        find node_modules -name "build.gradle" -exec sed -i "s/targetSdkVersion 34/targetSdkVersion 35/g" {} +
        echo "All plugins forced to API level 35"
        
    - name: Patch all Java versions to 17
      run: |
        # Force all Android modules to use Java 17
        find android -name "build.gradle" -exec sed -i 's/JavaVersion.VERSION_21/JavaVersion.VERSION_17/g' {} +
        find node_modules/@capacitor -name "build.gradle" -exec sed -i 's/JavaVersion.VERSION_21/JavaVersion.VERSION_17/g' {} +
        find android -name "build.gradle" -exec sed -i 's/sourceCompatibility = 21/sourceCompatibility = 17/g' {} +
        find android -name "build.gradle" -exec sed -i 's/targetCompatibility = 21/targetCompatibility = 17/g' {} +
      
    - name: Make gradlew executable
      run: chmod +x android/gradlew
      
    - name: Setup signing keystore
      env:
        UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
      run: |
        cd android
        if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
          echo "Using stored upload keystore from GitHub Secrets"
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
        else
          echo "ERROR: UPLOAD_KEYSTORE_BASE64 secret not set. Please add the keystore to GitHub Secrets."
          exit 1
        fi
        
        echo "Certificate fingerprint for verification:"
        keytool -list -v -keystore upload-keystore.jks -alias upload -storepass momapp2026 -keypass momapp2026 | grep -E "(SHA1|SHA256)"
        
    - name: Configure upload signing for Google Play
      run: |
        cd android/app
        cat >> build.gradle << 'EOF'
        
        android {
            signingConfigs {
                release {
                    storeFile file('../upload-keystore.jks')
                    storePassword 'momapp2026'
                    keyAlias 'upload'
                    keyPassword 'momapp2026'
                }
            }
            buildTypes {
                release {
                    signingConfig signingConfigs.release
                }
            }
        }
        EOF
        
    - name: Verify API Level Configuration
      run: |
        cd android
        echo "Checking API level configuration..."
        grep -r "targetSdkVersion\|compileSdkVersion" . --include="*.gradle"
        echo "Variables.gradle contents:"
        cat variables.gradle
        
    - name: Clean and Build Android App Bundle (signed for Google Play App Signing)
      run: |
        cd android
        export JAVA_HOME=$JAVA_HOME_17_X64
        export ANDROID_COMPILE_SDK=35
        export ANDROID_BUILD_TOOLS=35.0.0
        export ANDROID_TARGET_SDK=35
        
        # Aggressive clean to remove all cached API 34 references
        rm -rf .gradle build app/build app/.gradle capacitor-cordova-android-plugins/build capacitor-cordova-android-plugins/.gradle
        rm -rf ~/.gradle/caches
        
        # Verify configuration before building
        echo "=== VERIFYING ALL GRADLE FILES FOR API LEVELS ==="
        find . -name "*.gradle" -exec echo "=== {} ===" \; -exec grep -n "compileSdk\|targetSdk\|api.*level" {} \;
        
        ./gradlew clean bundleRelease -Dorg.gradle.java.home=$JAVA_HOME_17_X64 --no-daemon --no-build-cache --refresh-dependencies
        
    - name: Build Android APK (unsigned)
      run: |
        cd android
        export JAVA_HOME=$JAVA_HOME_17_X64
        export ANDROID_COMPILE_SDK=35
        export ANDROID_BUILD_TOOLS=35.0.0
        export ANDROID_TARGET_SDK=35
        ./gradlew assembleRelease -Dorg.gradle.java.home=$JAVA_HOME_17_X64
        
    - name: Upload App Bundle
      uses: actions/upload-artifact@v4
      with:
        name: app-bundle
        path: android/app/build/outputs/bundle/release/app-release.aab
        
    - name: Upload PEM certificate for Google Play Console reset
      uses: actions/upload-artifact@v4
      with:
        name: upload-certificate-pem
        path: android/upload_certificate.pem
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-apk
        path: android/app/build/outputs/apk/release/app-release.apk
        
    - name: Upload certificate fingerprint
      uses: actions/upload-artifact@v4
      with:
        name: upload-certificate-info
        path: android/upload-cert-fingerprint.txt
        
    - name: Upload keystore for backup (first-time only)
      uses: actions/upload-artifact@v4
      with:
        name: upload-keystore-backup
        path: android/upload-keystore.jks
      if: env.UPLOAD_KEYSTORE_BASE64 == ''
        
    - name: Check for ProGuard mapping file
      id: check-mapping
      run: |
        if [ -f "android/app/build/outputs/mapping/release/mapping.txt" ]; then
          echo "mapping_exists=true" >> $GITHUB_OUTPUT
        else
          echo "mapping_exists=false" >> $GITHUB_OUTPUT
          echo "No mapping file generated - this is normal for Capacitor apps with minimal obfuscation"
        fi
        
    - name: Upload ProGuard mapping file (if exists)
      uses: actions/upload-artifact@v4
      with:
        name: proguard-mapping
        path: android/app/build/outputs/mapping/release/mapping.txt
      if: steps.check-mapping.outputs.mapping_exists == 'true'